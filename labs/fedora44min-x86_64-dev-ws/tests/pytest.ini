# Run through lab-bootstrap-verify.mk, lab-gateway-verify.mk or
# lab-provision-verify.mk, which pass the lab's paths as environment variables
# (lab-config.mk PYTEST_ENV).
[pytest]
# lab.py (and the gateway and sandbox suites' gateway_lab.py, sandbox_lab.py)
# are imported as plain modules.
pythonpath = . gateway guest/sandbox
# importlib: host/ and guest/ both have a test_ca_trust.py and a test_packages.py.
addopts = -ra --strict-markers --strict-config --import-mode=importlib
# testinfra's ssh backend logs every command at DEBUG; keep failures readable.
log_level = WARNING
