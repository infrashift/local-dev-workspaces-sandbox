# The gateway's REAL credentials live encrypted in vault.yml beside this file
# (ansible-vault, the lab's .ansible_vault_key; gitignored), one variable
# each. Which variables, and what each one is, is the registry
# vars/gateway-secrets.yml (committed, names only); the gateway playbook reads
# the values from here, writes them into Vault, and never to a guest. Set or
# rotate one, at a hidden prompt:
#
#   make -f lab-gateway.mk secret-set NAME=private-scratch-1
#   make -f lab-gateway.mk secret-rotate NAME=private-scratch-1
#
# This host inventory is the only one that holds them: the guest inventory
# (inventory/) never loads it.
