---
# The host plays (bootstrap-host.yml, gateway-host.yml) configure this machine
# over a local connection. A separate inventory from the guests', whose
# group_vars/all (ansible_user: admin, ...) must never apply to localhost.
# host_vars/localhost/become.vault.yml (gitignored, ansible-vault encrypted)
# holds ansible_become_password; create it with:
#   make -f lab-bootstrap.mk become-vault
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
...
