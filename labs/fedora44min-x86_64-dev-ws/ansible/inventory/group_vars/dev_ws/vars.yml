---
# The sandbox VMs. Every play against them runs its tasks with the gateway's
# proxy environment (the guest has no other way out): Ansible's own get_url,
# uri and dnf go through the CONNECT tunnel too. gateway_ip and proxy_port
# come from lab-config.mk's extra vars; gateway_routes from vars/gateway.yml,
# which every guest playbook loads.
sandbox_proxy_url: "http://{{ gateway_ip }}:{{ proxy_port }}"
sandbox_no_proxy: >-
  {{ (['localhost', '127.0.0.1', '::1', gateway_ip] + (gateway_routes | map(attribute='host') | list)) | join(',') }}
sandbox_proxy_env:
  HTTP_PROXY: "{{ sandbox_proxy_url }}"
  HTTPS_PROXY: "{{ sandbox_proxy_url }}"
  http_proxy: "{{ sandbox_proxy_url }}"
  https_proxy: "{{ sandbox_proxy_url }}"
  NO_PROXY: "{{ sandbox_no_proxy }}"
  no_proxy: "{{ sandbox_no_proxy }}"
# The one Fedora mirror dnf may use (it is on the egress allow list:
# vars/egress-baseline.yml rpm-fedora).
sandbox_fedora_mirror: https://mirrors.kernel.org/fedora
...
