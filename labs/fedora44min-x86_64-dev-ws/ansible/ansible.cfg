[defaults]
# Relative paths resolve against this file's directory.
roles_path = ../../../ansible/roles/host:../../../ansible/roles/gateway:../../../ansible/roles/guest:roles
collections_path = ../../../.collections
host_key_checking = False
# Lab playbooks never need the system-wide collections.
collections_scan_sys_path = False

[ssh_connection]
# Setting ssh_args REPLACES Ansible's defaults, so its connection reuse
# (ControlMaster/ControlPersist) is restated here.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
# One SSH round trip per task instead of three or four. Fedora and EL sudoers
# have no requiretty, which pipelining with become would need.
pipelining = True
