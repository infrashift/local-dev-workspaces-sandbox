---
# The registry of the gateway's REAL credentials: their names, what each one
# is, and when it was rotated and expires. NEVER a value: each value lives
# ansible-vault encrypted in the host inventory's vault.yml
# (inventory-host/host_vars/localhost/vault.yml, gitignored) as the variable
# vault_var names. The gateway playbook writes it into Vault, never to a
# guest (concepts/Surrogate Credential Model).
#
#   make -f lab-gateway.mk secrets-list                   # held? rotated? expiring?
#   make -f lab-gateway.mk secret-set NAME=<name>         # set it, at a hidden prompt
#   make -f lab-gateway.mk secret-rotate NAME=<name>      # replace it, and record the dates here
#   make -f lab-gateway.mk secret-add NAME=<name> KIND=github-pat REPO=<owner/name>
#   make -f lab-gateway.mk secret-remove NAME=<name>
#   make -f lab-gateway.mk secrets-check                  # registry, surrogates and vault.yml agree
#
# Fields:
#   kind       github-pat         a fine-grained PAT limited to `repo` alone
#                                 (Contents and Metadata: read)
#              anthropic-api-key  an Anthropic API key
#   repo       github-pat only: the one repository, owner/name. Each one is a
#              private repository the sandbox may use (github_repos below).
#   vault_var  the vault.yml variable that holds the value
#   rotated    optional: the date the value was last set (secret-rotate fills it in)
#   expires    optional: the date the value stops working (a PAT's expiry).
#              The gateway playbook fails after it and warns 14 days before.
#
# Every surrogate in vars/gateway.yml names one of these (secret:); a
# GitHub surrogate's repo: must be its secret's repo. One entry per line:
# the secret-* targets edit this file line by line.
# yamllint disable rule:line-length
gateway_secret_registry:
  private-scratch-1: { kind: github-pat, repo: infrashift/private-scratch-1, vault_var: github_pat_private_scratch_1_secret }
  private-scratch-2: { kind: github-pat, repo: infrashift/private-scratch-2, vault_var: github_pat_private_scratch_2_secret }
  private-scratch-3: { kind: github-pat, repo: infrashift/private-scratch-3, vault_var: github_pat_private_scratch_3_secret }
  anthropic: { kind: anthropic-api-key, vault_var: anthropic_api_key_secret }
# yamllint enable rule:line-length

# The private GitHub repositories the sandbox may use, derived from the
# registry: {secret name: {repo: owner/name, ...}}. The gateway's Vault
# records and the guest's surrogates and MCP servers are built per entry.
github_repos: >-
  {{ gateway_secret_registry | dict2items | selectattr('value.kind', 'eq', 'github-pat') | items2dict }}
...
