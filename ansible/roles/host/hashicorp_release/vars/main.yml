---
# ---------------------------------------------------------------------------
# DERIVED VALUES AND ROLE CONSTANTS. Not caller-settable: defaults/ is
# reserved for inputs, and this role has none. The names follow the layout
# every product shares on releases.hashicorp.com.
# ---------------------------------------------------------------------------
# Shown in task names.
hashicorp_release_label: "{{ hashicorp_release_product }} {{ hashicorp_release_version }}"
hashicorp_release_base_url: >-
  https://releases.hashicorp.com/{{ hashicorp_release_product }}/{{ hashicorp_release_version }}
# releases.hashicorp.com names architectures the Go way.
hashicorp_release_arch_map:
  x86_64: amd64
hashicorp_release_zip: >-
  {{ hashicorp_release_product }}_{{ hashicorp_release_version }}_linux_{{
  hashicorp_release_arch_map[ansible_facts['architecture']] }}.zip
hashicorp_release_sums: "{{ hashicorp_release_product }}_{{ hashicorp_release_version }}_SHA256SUMS"
# The keyring only supplies candidate keys; the signature is accepted only from
# the pinned hashicorp_release_key_fpr. It is ASCII-armored, which gpgv cannot
# read, so the role dearmors it first.
hashicorp_release_key_url: https://www.hashicorp.com/.well-known/pgp-key.txt
hashicorp_release_gpg: /usr/bin/gpg
hashicorp_release_gpgv: /usr/bin/gpgv
hashicorp_release_unzip: /usr/bin/unzip
# How each product reports its version: most take a `version` subcommand,
# consul-template only a flag. Either way the first line reads "<name> vX.Y.Z".
hashicorp_release_version_args_map:
  consul-template: [-version]
hashicorp_release_version_args: >-
  {{ hashicorp_release_version_args_map[hashicorp_release_product] | default(['version']) }}
hashicorp_release_version_argv: >-
  {{ [hashicorp_release_dest ~ '/' ~ hashicorp_release_product] + hashicorp_release_version_args }}
# `<product> version` would otherwise phone home to check for a newer release.
hashicorp_release_env:
  CHECKPOINT_DISABLE: "1"
...
