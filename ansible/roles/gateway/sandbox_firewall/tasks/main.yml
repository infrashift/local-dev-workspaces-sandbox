---
# The sandbox network's host firewall: from the sandbox bridge the host
# accepts only Envoy's two listeners (and DHCP, and replies), and forwards
# nothing (concepts/Isolated Sandbox Network). The isolated libvirt network
# already gives the guest no route; this makes the host itself unreachable
# too, on every one of its addresses, and keeps that true if a route appears.

# ---------------------------------------------------------------------------
# CONTRACT BRACKET — this role configures the Linux x86_64 host itself.
# ---------------------------------------------------------------------------
- name: Assert that facts were gathered
  ansible.builtin.assert:
    that: ansible_facts['system'] is defined
    fail_msg: "This role reads ansible_facts; run it from a play with gather_facts: true."
    quiet: true

- name: Assert this is the Linux x86_64 host, configured locally
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['architecture'] == 'x86_64'
      - ansible_connection == 'local'
    fail_msg: >-
      ai-sandbox needs the Linux x86_64 host over a local connection (got {{ ansible_facts['system'] }}
      {{ ansible_facts['architecture'] }}, connection {{ ansible_connection }})
    quiet: true

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. The playbook passes every
# value below, so a missing one fails here, by name, before any work happens.
# ---------------------------------------------------------------------------
- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - sandbox_firewall_bridge is defined and sandbox_firewall_bridge is match('^[a-z][a-z0-9_-]{0,14}$')
      - sandbox_firewall_gateway_ip is defined and sandbox_firewall_gateway_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
      - sandbox_firewall_ports is defined and sandbox_firewall_ports is sequence
      - sandbox_firewall_ports is not string
      - sandbox_firewall_ports | length > 0
      - sandbox_firewall_ports | map('int') | select('gt', 0) | list | length == sandbox_firewall_ports | length
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — the playbook must pass each one:
        sandbox_firewall_bridge      the sandbox network's bridge (SANDBOX_BRIDGE)
        sandbox_firewall_gateway_ip  the host's address on it (GATEWAY_IP)
        sandbox_firewall_ports       the TCP ports the guest may reach there (PROXY_PORT, GATEWAY_PORT)
    quiet: true

- name: Show the requested parameters
  ansible.builtin.debug:
    msg: >-
      {{ sandbox_firewall_bridge }}: only {{ sandbox_firewall_gateway_ip }}:{{ sandbox_firewall_ports | join(',') }}

# ---------------------------------------------------------------------------
# ROLE TASKS
# ---------------------------------------------------------------------------
- name: Install the sandbox firewall
  become: true
  block:
    - name: Install nftables (the nft command; nftables.service stays disabled)
      ansible.builtin.apt:
        name: "{{ sandbox_firewall_packages }}"
        state: present

    - name: Create /etc/ai-sandbox
      ansible.builtin.file:
        path: "{{ sandbox_firewall_rules | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the ruleset (checked by nft before it is installed)
      ansible.builtin.template:
        src: nftables.nft.j2
        dest: "{{ sandbox_firewall_rules }}"
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/nft -c -f %s
      register: sandbox_firewall_ruleset
      notify: sandbox_firewall reload

    - name: Install the systemd unit
      ansible.builtin.template:
        src: ai-sandbox-firewall.service.j2
        dest: "{{ sandbox_firewall_unit }}"
        owner: root
        group: root
        mode: "0644"
      notify: sandbox_firewall reload

    # In a dry run on a fresh host the unit does not exist yet.
    - name: Stat the systemd unit
      ansible.builtin.stat:
        path: "{{ sandbox_firewall_unit }}"
      register: sandbox_firewall_unit_stat

    - name: Enable and start the sandbox firewall
      ansible.builtin.systemd_service:
        name: ai-sandbox-firewall
        enabled: true
        state: started
        daemon_reload: true
      when: sandbox_firewall_unit_stat.stat.exists or not ansible_check_mode

- name: Apply a pending firewall reload now
  ansible.builtin.meta: flush_handlers

# ---------------------------------------------------------------------------
# VERIFICATION — the loaded table is the one on disk: the input chain refuses
# the gateway address on every interface but the bridge and lo, accepts only
# the gateway ports and ends in a reject; the forward chain rejects the bridge
# both ways.
# ---------------------------------------------------------------------------
- name: Read the loaded table
  ansible.builtin.command: /usr/sbin/nft -j list table inet {{ sandbox_firewall_table }}
  register: sandbox_firewall_loaded
  changed_when: false
  check_mode: false
  failed_when: false
  become: true

- name: Assert the sandbox firewall is loaded as written
  ansible.builtin.assert:
    that:
      - sandbox_firewall_loaded.rc == 0
      - sandbox_firewall_loaded.stdout is search('chain.{0,4}input')
      - sandbox_firewall_loaded.stdout is search('"reject"')
      - sandbox_firewall_loaded.stdout is search(sandbox_firewall_gateway_ip | regex_escape)
      # The weak-host rule: the gateway address from any interface but these two.
      - sandbox_firewall_loaded.stdout is search('"lo"')
    fail_msg: "table inet {{ sandbox_firewall_table }} is not loaded as written: {{ sandbox_firewall_loaded.stderr }}"
    success_msg: "table inet {{ sandbox_firewall_table }} loaded"
  # A dry run checks what is loaded only when the ruleset on disk would not change.
  when: >-
    not ansible_check_mode
    or (sandbox_firewall_loaded.rc == 0 and sandbox_firewall_ruleset is not changed)
...
