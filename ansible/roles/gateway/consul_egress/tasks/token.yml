---
# Ensure a token file holds a valid Consul ACL token carrying one policy;
# create the token (and the file) otherwise.
#   consul_egress_token: { file, owner, group, mode, policy, description }
- name: "Read {{ consul_egress_token.file }}"
  ansible.builtin.slurp:
    src: "{{ consul_egress_token.file }}"
  register: consul_egress_token_b64
  failed_when: false
  become: true
  no_log: true

- name: "Check the token in {{ consul_egress_token.file }}"
  ansible.builtin.uri:
    url: "{{ consul_egress_url }}/v1/acl/token/self"
    unix_socket: "{{ consul_egress_socket }}"
    headers: { X-Consul-Token: "{{ consul_egress_token_b64.content | default('') | b64decode | trim }}" }
    status_code: [200, 403]
  register: consul_egress_token_self
  check_mode: false
  no_log: true

- name: "Decide whether to create the token for {{ consul_egress_token.file }}"
  ansible.builtin.set_fact:
    consul_egress_token_needed: >-
      {{ consul_egress_token_self.status != 200
         or consul_egress_token.policy
            not in (consul_egress_token_self.json.Policies | default([]) | map(attribute='Name')) }}

- name: "Would create a token in {{ consul_egress_token.file }}"
  ansible.builtin.debug:
    msg: "{{ consul_egress_token.description }}"
  changed_when: true
  when: ansible_check_mode and consul_egress_token_needed

- name: "Create a token: {{ consul_egress_token.policy }}"
  ansible.builtin.uri:
    url: "{{ consul_egress_url }}/v1/acl/token"
    unix_socket: "{{ consul_egress_socket }}"
    method: PUT
    headers: { X-Consul-Token: "{{ consul_egress_mgmt_token }}" }
    body_format: json
    body:
      Description: "{{ consul_egress_token.description }}"
      Policies: [{ Name: "{{ consul_egress_token.policy }}" }]
  register: consul_egress_token_created
  changed_when: true
  no_log: true
  when: not ansible_check_mode and consul_egress_token_needed

- name: "Store the token in {{ consul_egress_token.file }}"
  ansible.builtin.copy:
    content: "{{ consul_egress_token_created.json.SecretID }}\n"
    dest: "{{ consul_egress_token.file }}"
    owner: "{{ consul_egress_token.owner }}"
    group: "{{ consul_egress_token.group }}"
    mode: "{{ consul_egress_token.mode }}"
  become: true
  no_log: true
  when: not ansible_check_mode and consul_egress_token_needed

# A token kept from an earlier run keeps its file, but not a former owner:
# consul-template's token moved from group envoy to its own.
- name: "Set the owner and mode of {{ consul_egress_token.file }}"
  ansible.builtin.file:
    path: "{{ consul_egress_token.file }}"
    owner: "{{ consul_egress_token.owner }}"
    group: "{{ consul_egress_token.group }}"
    mode: "{{ consul_egress_token.mode }}"
  become: true
  when: not consul_egress_token_needed
...
