---
- name: Restart consul-template
  ansible.builtin.systemd_service:
    name: ai-sandbox-consul-template
    state: restarted
    daemon_reload: true
  become: true
  listen: envoy_gateway restart consul-template
  # A dry run writes no unit or config, so there is nothing to restart.
  when: not ansible_check_mode

- name: Restart envoy
  ansible.builtin.systemd_service:
    name: envoy
    state: restarted
    daemon_reload: true
  become: true
  listen: envoy_gateway restart envoy
  # A dry run writes no unit or config, so there is nothing to restart.
  when: not ansible_check_mode
...
