---
# Variants this role supports. Only fedora44 is exercised by a lab today; the
# EL entries are asserted against their prerequisites rather than assumed.
python_tools_compatibility_list:
  - fedora44
  - redhat9
  - redhat10
  - rocky9
  - rocky10
python_tools_variant: "{{ ansible_facts['distribution'] | lower }}{{ ansible_facts['distribution_major_version'] }}"

# ---------------------------------------------------------------------------
# DERIVED VALUES AND ROLE CONSTANTS — not caller-settable.
# ---------------------------------------------------------------------------
python_tools_home: "{{ ansible_facts['user_dir'] }}"
# The uv role's install; this role asserts it is there rather than looking
# for any uv on PATH.
python_tools_uv: "{{ python_tools_home }}/.local/bin/uv"
python_tools_bin: "{{ python_tools_home }}/.local/bin/basedpyright"
python_tools_ansi_pattern: '\x1b\[[0-9;]*m'
python_tools_version_pattern: "(?m)^basedpyright {{ python_tools_basedpyright_version | regex_escape }}(\\s|$)"

# uv's own defaults, stated: tools under ~/.local/share/uv/tools, entry points
# in ~/.local/bin. UV_PYTHON_DOWNLOADS=never makes a missing interpreter an
# error instead of an unpinned download. SSL_CERT_FILE: uv ships its own root
# certificates, so without it uv would not trust a TLS-intercepting proxy's CA
# that ca_trust installed in the system bundle.
python_tools_env:
  HOME: "{{ python_tools_home }}"
  PATH: "{{ python_tools_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  UV_TOOL_DIR: "{{ python_tools_home }}/.local/share/uv/tools"
  UV_TOOL_BIN_DIR: "{{ python_tools_home }}/.local/bin"
  UV_PYTHON_DOWNLOADS: never
  SSL_CERT_FILE: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
  # ansible-lint colours --version even without a terminal; ANSI escapes
  # would break the version match (also stripped below, as a defence).
  NO_COLOR: "1"

# The venv uv tool install creates for basedpyright, where the bundled npm is
# removed from.
python_tools_venv: "{{ python_tools_env.UV_TOOL_DIR }}/basedpyright"
...
