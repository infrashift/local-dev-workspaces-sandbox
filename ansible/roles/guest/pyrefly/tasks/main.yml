---
# pyrefly (Python language server and type checker, a native binary) with
# `uv tool install` into ~/.local/share/uv/tools, entry point in ~/.local/bin.
# Needs the uv role, and an interpreter the guest already has.

# ---------------------------------------------------------------------------
# CONTRACT BRACKET — keep these at the top of every guest role.
# ---------------------------------------------------------------------------
- name: Assert that facts were gathered
  ansible.builtin.assert:
    that: ansible_facts['distribution'] is defined and ansible_facts['architecture'] is defined
    fail_msg: "This role reads ansible_facts; run it from a play with gather_facts: true (or after setup)."
    quiet: true

- name: Assert that this guest is a supported variant
  ansible.builtin.assert:
    that:
      - pyrefly_variant in pyrefly_compatibility_list
      - ansible_facts['architecture'] in ['aarch64', 'x86_64']
    fail_msg: >-
      pyrefly supports {{ pyrefly_compatibility_list | join(', ') }} on aarch64/x86_64;
      this guest is {{ pyrefly_variant }} {{ ansible_facts['architecture'] }}.
    quiet: true

- name: Assert that the play names the account it provisions
  ansible.builtin.assert:
    that: guest_user is defined and guest_user is match('^[a-z_][a-z0-9_-]*$')
    fail_msg: "Set guest_user (the account this user-lane role installs for) at the play level."
    quiet: true

- name: Check which account the role runs as
  ansible.builtin.command: id -un
  register: pyrefly_whoami
  changed_when: false
  check_mode: false

# Everything lands in this account's home, so it must be the account running
# the role -- files are then owned correctly by construction, with no become,
# owner/group or chown. Facts must come from the same account: the home
# directory is read from them.
- name: Assert that the role runs in the user lane, as guest_user
  ansible.builtin.assert:
    that:
      - pyrefly_whoami.stdout == guest_user
      - ansible_facts['user_id'] == guest_user
    fail_msg: >-
      pyrefly installs into {{ guest_user }}'s home and must run as that account: apply
      it from a play that connects as guest_user without become (it ran as
      {{ pyrefly_whoami.stdout }}; facts were gathered as {{ ansible_facts['user_id'] }}).
    quiet: true

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. The playbook passes every
# value below, so a missing one fails here, by name, before any work happens.
# ---------------------------------------------------------------------------
- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - pyrefly_version is defined and pyrefly_version is match('^\d+\.\d+\.\d+$')
      - pyrefly_python_version is defined and pyrefly_python_version is match('^\d+\.\d+$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — the playbook must pass each one:
        pyrefly_version  X.Y.Z (PyPI)
        pyrefly_python_version  X.Y: the interpreter the tool's virtualenv runs on;
            it must already be installed (uv is told never to download one)
    quiet: true

- name: Show the requested parameters
  ansible.builtin.debug:
    msg: "pyrefly {{ pyrefly_version }} on python {{ pyrefly_python_version }}"

# ---------------------------------------------------------------------------
# ROLE TASKS — userland only. Everything lands under ~/.local.
# ---------------------------------------------------------------------------
- name: Look for uv
  ansible.builtin.stat:
    path: "{{ pyrefly_uv }}"
  register: pyrefly_uv_stat

- name: Assert that uv is available
  ansible.builtin.assert:
    that: pyrefly_uv_stat.stat.exists
    fail_msg: >-
      pyrefly installs with `uv tool install`, and found no uv at {{ pyrefly_uv }}.
      Apply the uv role earlier in the same play.
    quiet: true
  when: not ansible_check_mode

# In a dry run the uv role may only have reported that it would install uv.
- name: "Would install, once uv is installed: pyrefly {{ pyrefly_version }}"
  ansible.builtin.debug:
    msg: >-
      {{ pyrefly_uv }} tool install --python {{ pyrefly_python_version }}
      pyrefly=={{ pyrefly_version }}
  changed_when: true
  when: not pyrefly_uv_stat.stat.exists

- name: Install and verify pyrefly {{ pyrefly_version }}
  when: pyrefly_uv_stat.stat.exists
  block:
    - name: "Check for the interpreter: Python {{ pyrefly_python_version }}"
      ansible.builtin.command:
        argv: ["{{ pyrefly_uv }}", python, find, "{{ pyrefly_python_version }}"]
      environment: "{{ pyrefly_env }}"
      register: pyrefly_python
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert that the interpreter exists (uv will not download one)
      ansible.builtin.assert:
        that: pyrefly_python.rc == 0
        fail_msg: >-
          No Python {{ pyrefly_python_version }} is installed, and uv is told never to
          download one. Fedora 44's system python3 is 3.14; on EL install the
          matching python3.X package first (e.g. python3.12 on EL 9), or set
          pyrefly_python_version to an interpreter the guest has.
          uv said: {{ pyrefly_python.stderr | trim }}
        success_msg: "python {{ pyrefly_python_version }}: {{ pyrefly_python.stdout | trim }}"

    # Gate on the version the installed tool reports, not on uv's output: uv
    # prints "... is already installed" on a no-op, which reads like a change.
    - name: Check the installed pyrefly version
      ansible.builtin.command:
        argv: ["{{ pyrefly_bin }}", --version]
      environment: "{{ pyrefly_env }}"
      register: pyrefly_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Decide whether to install pyrefly {{ pyrefly_version }}
      ansible.builtin.set_fact:
        pyrefly_install_required: >-
          {{ pyrefly_installed.rc != 0
             or pyrefly_installed.stdout | regex_replace(pyrefly_ansi_pattern, '')
                is not search(pyrefly_version_pattern) }}

    - name: Would install pyrefly {{ pyrefly_version }}
      ansible.builtin.debug:
        msg: >-
          {{ pyrefly_uv }} tool install --force --python {{ pyrefly_python_version }}
          pyrefly=={{ pyrefly_version }}
      changed_when: true
      when: pyrefly_install_required and ansible_check_mode

    - name: "Install with uv tool install: pyrefly {{ pyrefly_version }}"
      ansible.builtin.command:
        argv:
          - "{{ pyrefly_uv }}"
          - tool
          - install
          - --force
          - --python
          - "{{ pyrefly_python_version }}"
          - "pyrefly=={{ pyrefly_version }}"
      environment: "{{ pyrefly_env }}"
      changed_when: true
      when: pyrefly_install_required and not ansible_check_mode

    # -----------------------------------------------------------------------
    # VERIFICATION — skipped only in a dry run that would install.
    # -----------------------------------------------------------------------
    - name: Verify pyrefly
      ansible.builtin.command:
        argv: ["{{ pyrefly_bin }}", --version]
      environment: "{{ pyrefly_env }}"
      register: pyrefly_verify
      changed_when: false
      check_mode: false
      when: not (ansible_check_mode and pyrefly_install_required)

    - name: "Assert that the requested version is installed: pyrefly {{ pyrefly_version }}"
      ansible.builtin.assert:
        that:
          - >-
            pyrefly_verify.stdout | regex_replace(pyrefly_ansi_pattern, '')
            is search(pyrefly_version_pattern)
        fail_msg: >-
          Expected pyrefly {{ pyrefly_version }}; it reported: {{ pyrefly_verify.stdout }}
        success_msg: "{{ pyrefly_verify.stdout_lines | join('; ') }}"
      when: not (ansible_check_mode and pyrefly_install_required)
...
