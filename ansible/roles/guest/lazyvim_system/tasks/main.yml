---
# The system packages LazyVim needs, installed in the system lane; the lazyvim
# role (user lane) configures Neovim on top of them. Splitting the two keeps
# each lane honest: nothing in $HOME is written as root, and nothing under
# /usr by the account being provisioned.

# ---------------------------------------------------------------------------
# CONTRACT BRACKET — keep these at the top of every guest role.
# ---------------------------------------------------------------------------
- name: Assert that facts were gathered
  ansible.builtin.assert:
    that: ansible_facts['distribution'] is defined and ansible_facts['architecture'] is defined
    fail_msg: "This role reads ansible_facts; run it from a play with gather_facts: true (or after setup)."
    quiet: true

- name: Assert that this guest is a supported variant
  ansible.builtin.assert:
    that:
      - lazyvim_system_variant in lazyvim_system_compatibility_list
      - ansible_facts['architecture'] in ['aarch64', 'x86_64']
    fail_msg: >-
      lazyvim_system supports {{ lazyvim_system_compatibility_list | join(', ') }} on aarch64/x86_64;
      this guest is {{ lazyvim_system_variant }} {{ ansible_facts['architecture'] }}.
    quiet: true

- name: Check which account the role runs as
  ansible.builtin.command: id -un
  register: lazyvim_system_whoami
  changed_when: false
  check_mode: false

- name: Assert that the role runs in the system lane
  ansible.builtin.assert:
    that: lazyvim_system_whoami.stdout == 'root'
    fail_msg: >-
      lazyvim_system writes system state and must run as root: apply it from a play with
      become: true (it ran as {{ lazyvim_system_whoami.stdout }}).
    quiet: true

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role takes no parameters, so it has the contract
# bracket above and deliberately no parameter assert.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ROLE TASKS
# ---------------------------------------------------------------------------
# ripgrep and fd-find are not in the RHEL/Rocky base repositories. Say so by
# name instead of failing inside dnf with "No match for argument".
- name: List the enabled repositories
  ansible.builtin.command: "{{ 'dnf5' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf' }} -q repolist --enabled"
  register: lazyvim_system_repos
  changed_when: false
  check_mode: false
  when: ansible_facts['distribution'] != 'Fedora'

- name: Assert that EPEL is enabled (EL guests)
  ansible.builtin.assert:
    that: lazyvim_system_repos.stdout is search('(?m)^epel\s')
    fail_msg: >-
      {{ lazyvim_system_epel_packages | join(' and ') }} come from EPEL on
      {{ lazyvim_system_variant }}, and no epel repository is enabled. Enable it first
      (RHEL: subscription-manager repos --enable
      codeready-builder-for-rhel-{{ ansible_facts['distribution_major_version'] }}-$(arch)-rpms
      && dnf install epel-release; Rocky: dnf install epel-release).
    quiet: true
  when: ansible_facts['distribution'] != 'Fedora'

- name: Install {{ lazyvim_system_packages | join(', ') }}
  ansible.builtin.package:
    name: "{{ lazyvim_system_packages }}"
    state: present
  register: lazyvim_system_installed

# ---------------------------------------------------------------------------
# VERIFICATION — skipped in a dry run that would install something.
# ---------------------------------------------------------------------------
- name: Probe the installed prerequisites
  ansible.builtin.command: "{{ item }} --version"
  loop: "{{ lazyvim_system_commands }}"
  register: lazyvim_system_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (ansible_check_mode and lazyvim_system_installed is changed)

- name: Assert that every prerequisite runs
  ansible.builtin.assert:
    that: lazyvim_system_probe.results | map(attribute='rc') | select('ne', 0) | list | length == 0
    fail_msg: >-
      A LazyVim prerequisite did not run:
      {{ lazyvim_system_probe.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}
    success_msg: "{{ lazyvim_system_probe.results | map(attribute='stdout_lines') | map('first') | list | join('; ') }}"
  when: not (ansible_check_mode and lazyvim_system_installed is changed)
...
