---
# Variants this role supports. Only fedora44 is exercised by a lab today; the
# EL entries are asserted against their prerequisites rather than assumed.
lazyvim_system_compatibility_list:
  - fedora44
  - redhat9
  - redhat10
  - rocky9
  - rocky10
lazyvim_system_variant: "{{ ansible_facts['distribution'] | lower }}{{ ansible_facts['distribution_major_version'] }}"

# ---------------------------------------------------------------------------
# ROLE CONSTANTS
#
#   gcc       nvim-treesitter compiles every parser from source with the
#             tree-sitter CLI, which needs a C compiler.
#   git       lazy.nvim installs and restores plugins with git.
#   ripgrep   LazyVim's grep pickers.
#   fd-find   LazyVim's file pickers.
# ---------------------------------------------------------------------------
lazyvim_system_packages:
  - gcc
  - git
  - ripgrep
  - fd-find
lazyvim_system_epel_packages:
  - ripgrep
  - fd-find
lazyvim_system_commands:
  - cc
  - git
  - rg
  - fd
...
